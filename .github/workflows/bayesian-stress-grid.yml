name: Bayesian Robustness Stress Grid

on:
  workflow_dispatch:
  push:
    paths:
      - "src/gds_core/balanced_loss.py"
      - "src/gds_core/posterior.py"
      - "src/gds_core/sinc_prior.py"
      - "experiments/expanded_stress_grid.py"
      - "tests/test_expanded_stress_grid.py"

concurrency:
  group: gds-bayesian-stress-grid-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  stress-grid:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install GDS
        run: python -m pip install .
      - name: Run expanded Monte Carlo stress grid
        run: |
          python experiments/expanded_stress_grid.py \
            --sample-sizes 40 80 160 \
            --repetitions 200 \
            --points 2048 \
            --seed 20261115 \
            --output expanded_stress_grid_results.json
      - name: Upload stress-grid results
        uses: actions/upload-artifact@v4
        with:
          name: gds-expanded-bayesian-stress-grid
          path: expanded_stress_grid_results.json
          if-no-files-found: error
          retention-days: 30
      - name: Archive results in repository
        uses: actions/github-script@v7
        env:
          RESULTS_FILE: expanded_stress_grid_results.json
        with:
          script: |
            const fs = require('fs');
            const content = fs.readFileSync(process.env.RESULTS_FILE, 'utf8');
            const path = 'results/expanded_stress_grid_seed_20261115.json';
            let sha;
            try {
              const existing = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path,
                ref: 'main'
              });
              sha = existing.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              message: 'Archive expanded Bayesian stress-grid results (seed 20261115)',
              content: Buffer.from(content).toString('base64'),
              branch: 'main',
              ...(sha ? { sha } : {})
            });
