name: LaTeX Build

on:
  push:
    paths:
      - "the_theory_of_gainful_distillation.tex"
  pull_request:
    paths:
      - "the_theory_of_gainful_distillation.tex"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-pictures

      - name: Compile treatise
        run: |
          pdflatex -interaction=nonstopmode -halt-on-error the_theory_of_gainful_distillation.tex
          pdflatex -interaction=nonstopmode -halt-on-error the_theory_of_gainful_distillation.tex

      - name: Upload compiled manuscript
        uses: actions/upload-artifact@v4
        with:
          name: gainful-distillation-manuscript
          path: the_theory_of_gainful_distillation.pdf
          if-no-files-found: error
